---
- name: Installer Samba
  ansible.builtin.apt:
    name: samba
    state: present

- name: Dossier partagé
  ansible.builtin.file:
    path: /srv/partage
    state: directory
    mode: "0770"

- name: Configuration Samba
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    mode: "0644"
  notify: restart smbd
