all:
  vars:
    ansible_user: labadmin
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
  children:
    prod:
      hosts:
        PC-EMP-01: { ansible_host: 192.168.10.11 }
        PC-EMP-02: { ansible_host: 192.168.10.12 }
        PC-EMP-03: { ansible_host: 192.168.10.13 }
      vars:
        ansible_connection: winrm
        ansible_user: labadmin
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore
    srv:
      hosts:
        SRV-MAIL: { ansible_host: 192.168.20.10 }
        SRV-FICHIERS: { ansible_host: 192.168.20.11 }
    backup:
      hosts:
        SRV-SAUVEGARDE: { ansible_host: 192.168.30.10 }
    soc:
      hosts:
        SIEM-ELASTIC: { ansible_host: 192.168.40.10 }
    attacker:
      hosts:
        ATTAQUANT: { ansible_host: 192.168.99.10 }
    linux_servers:
      children:
        srv:
        backup:
        soc:
    elastic_agents:
      children:
        srv:
        backup:
